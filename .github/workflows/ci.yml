name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Provide ffmpeg
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "system: $(ffmpeg -version | head -1)"
          else
            # runner 没预装时不去 apt（慢且容易卡锁），直接用静态二进制 wheel
            python -m pip install imageio-ffmpeg
            FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
            echo "AUDIOFORGE_FFMPEG=$FF" >> "$GITHUB_ENV"
            echo "bundled: $("$FF" -version | head -1)"
          fi

      - name: Install package (no third-party deps)
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip list --format=freeze | grep -i audio-forge

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test the CLI
        run: |
          audioforge --version
          audioforge formats
          audioforge --help > /dev/null
          python -m audioforge --version

      - name: Smoke test the HTTP server
        run: |
          set -euo pipefail
          audioforge serve --port 8123 --workdir "$RUNNER_TEMP/af" -q &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/api/health -o /tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          grep -q '"ncm": true' /tmp/health.json
          curl -sf http://127.0.0.1:8123/ | grep -q 'audio-forge'
          curl -sf http://127.0.0.1:8123/app.js | grep -q 'api/convert'
          echo "server smoke OK"

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Wheel must contain web assets
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["audioforge/web/index.html", "audioforge/web/app.js", "audioforge/web/style.css"]
          missing = [n for n in need if not any(x.endswith(n) for x in names)]
          print(f"{whl}: {len(names)} entries")
          if missing:
              sys.exit(f"missing assets: {missing}")
          print("web assets OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
