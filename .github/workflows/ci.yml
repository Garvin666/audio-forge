name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      # action 一律固定到 commit SHA：标签（@v4）是可以被上游改写的，SHA 不能
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: |
          ruff check --output-format=github .
          ruff --version

      - name: mypy
        run: |
          mypy
          mypy --version

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Provide ffmpeg
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "system: $(ffmpeg -version | head -1)"
          else
            # runner 没预装时不去 apt（慢且容易卡锁），直接用静态二进制 wheel
            python -m pip install imageio-ffmpeg
            FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
            echo "AUDIOFORGE_FFMPEG=$FF" >> "$GITHUB_ENV"
            echo "bundled: $("$FF" -version | head -1)"
          fi

      - name: Install package (no runtime deps)
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip list --format=freeze | grep -i audio-forge

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Coverage gate
        if: matrix.python-version == '3.12'
        run: |
          pip install "coverage[toml]>=7.4"
          # 门限写在 pyproject.toml 的 [tool.coverage.report]
          coverage run --source=src/audioforge -m unittest discover -s tests -t .
          coverage report -m

      - name: Smoke test the CLI
        run: |
          audioforge --version
          audioforge formats
          audioforge --help > /dev/null
          python -m audioforge --version

      - name: Smoke test the HTTP server
        run: |
          set -euo pipefail
          audioforge serve --port 8123 --workdir "$RUNNER_TEMP/af" -q &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/api/ping -o /tmp/ping.json; then break; fi
            sleep 0.5
          done
          cat /tmp/ping.json
          curl -sf http://127.0.0.1:8123/api/ready
          curl -sf http://127.0.0.1:8123/api/health -o /tmp/health.json
          cat /tmp/health.json
          grep -q '"ncm": true' /tmp/health.json
          curl -sf http://127.0.0.1:8123/ | grep -q 'audio-forge'
          curl -sf http://127.0.0.1:8123/app.js | grep -q 'api/convert'
          echo "server smoke OK"

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Wheel must contain web assets and match __version__
        run: |
          python - <<'PY'
          import glob, pathlib, re, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["audioforge/web/index.html", "audioforge/web/app.js",
                  "audioforge/web/style.css", "audioforge/py.typed"]
          missing = [n for n in need if not any(x.endswith(n) for x in names)]
          print(f"{whl}: {len(names)} entries")
          if missing:
              sys.exit(f"missing assets: {missing}")
          # 版本单一来源：pyproject 里是 dynamic，所以这里顺便核一次
          init = pathlib.Path("src/audioforge/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          if version not in whl:
              sys.exit(f"wheel name {whl} does not carry __version__ {version}")
          print(f"web assets OK, version {version}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheel
          path: dist/*.whl
