# audio-forge 的 Nginx 反代配置。
#
# 放到 /etc/nginx/conf.d/audio-forge.conf（conf.d 被 include 在 http 块内），
# 把 audio.example.com 换掉，证书路径换成自己的，然后 nginx -t && systemctl reload nginx。
#
# 注意分工：**鉴权和配额已经在应用里做了**（audioforge serve --auth / --token / --rate ...），
# 这一层只负责 TLS、连接级限流、上传体上限和几个安全头。
# 如果你更希望「Nginx 挡鉴权、应用不再管」，把下面的 auth_basic 打开、应用侧去掉 --auth 也行，
# 但那样应用就不知道是谁在用，配额会退化成「按 IP 一刀切」。

# 连接级限流：每 IP 30 请求/秒（上传大文件耗时长，别设太小）
limit_req_zone $binary_remote_addr zone=audio_forge_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=audio_forge_conn:10m;

# 限流要回 429 而不是默认的 503：503 会被当成「服务挂了」，
# 与应用层（--rate 超限回 429 + Retry-After）语义也对不上。
limit_req_status  429;
limit_conn_status 429;

upstream audio_forge_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name audio.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name audio.example.com;

    ssl_certificate     /etc/letsencrypt/live/audio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 必须 >= 应用侧 --max-mb，留 10 MB 给 multipart 头和字段
    client_max_body_size 210m;
    client_body_timeout  300s;

    # 上传动辄上百 MB，不要缓冲到磁盘再转发
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_http_version      1.1;
    proxy_set_header        Connection "";

    limit_conn audio_forge_conn 8;

    # 可选：再叠一层 Basic Auth（应用侧已有时可省略）
    # auth_basic           "audio-forge";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # 可选：只允许公司出口 IP
    # allow 203.0.113.0/24;
    # deny  all;

    # ⚠️ 安全头必须在每个 location 里写全，不能只在 server 级写一次：
    #    nginx 的 add_header 规则是「子级只要出现任意一个 add_header，就完全不继承父级的」。
    #    实测踩过：server 级写了四个头、再在 location 里加一条 Referrer-Policy，
    #    结果该 location 的响应里 nosniff / X-Frame-Options / HSTS 全部消失。
    #    所以下面每个 location 各写四行（server 级那份只兜底错误页）。

    location /api/ {
        limit_req zone=audio_forge_req burst=40 nodelay;

        proxy_pass http://audio_forge_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 转码慢，读超时给足；否则 200 MB 的 flac 会在中途 504
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # 令牌可能出现在 ?token= 里，别让它跟着 Referer 漏出去
        add_header Referrer-Policy           "no-referrer" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /api/health {
        # 健康检查给监控用，限流放宽一点
        limit_req zone=audio_forge_req burst=10 nodelay;
        proxy_pass http://audio_forge_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Referrer-Policy           "no-referrer" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://audio_forge_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Referrer-Policy           "no-referrer" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # server 级只兜底没有 location 命中的响应（如 404 错误页）
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/audio-forge.access.log;
    error_log  /var/log/nginx/audio-forge.error.log warn;
}
