services:
  audio-forge:
    build: .
    image: audio-forge:latest
    container_name: audio-forge
    ports:
      - "127.0.0.1:8000:8000"    # 只绑回环，避免默认暴露到局域网
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
